<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="leonards-arcade-picks" content="Elise's grassland · A robot dog · Endless runner · The music knows">
<title>Meadow Dash</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a0f2e; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const TAU = Math.PI * 2;
  const TAG = "Leonard's Arcade · sample game";
  const VW = 960, VH = 540, GROUND = 430;

  let W = 0, H = 0, S = 1, OX = 0, OY = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W / VW, H / VH); OX = (W - VW * S) / 2; OY = (H - VH * S) / 2;
  }
  addEventListener("resize", resize);
  resize();
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- sound and THE MUSIC, which knows how fast you are going ----------
  let AC = null, master = null, musicBus = null, noiseBuf = null, muted = false;
  function initAudio() {
    if (AC) { if (AC.state === "suspended") AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
      musicBus = AC.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  function note(f, t, dur, type, vol, bus = master, to = 0) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.05);
  }
  function hiss(t, dur, vol, freq, bus = master, type = "highpass") {
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(bus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  const sfx = {
    jump() { if (AC) note(300, AC.currentTime, 0.18, "square", 0.08, master, 620); },
    double() { if (AC) note(500, AC.currentTime, 0.16, "square", 0.08, master, 900); },
    slide() { if (AC) hiss(AC.currentTime, 0.25, 0.15, 1200, master, "bandpass"); },
    get() { if (AC) { const t = AC.currentTime; note(988, t, 0.1, "triangle", 0.12); note(1319, t + 0.06, 0.16, "triangle", 0.12); } },
    hit() { if (AC) { const t = AC.currentTime; hiss(t, 0.5, 0.5, 400, master, "lowpass"); note(160, t, 0.4, "sawtooth", 0.18, master, 50); } },
    bark() { if (AC) { const t = AC.currentTime; note(520, t, 0.09, "square", 0.12, master, 300); note(560, t + 0.13, 0.09, "square", 0.12, master, 320); } },
  };
  // I - V - vi - IV in C, a bar each; the tempo is the game's speed
  const PROG = [[48, 55, 60, 64], [43, 50, 55, 59], [45, 52, 57, 60], [41, 48, 53, 57]];
  const mtof = m => 440 * 2 ** ((m - 69) / 12);
  let musicStep = 0, musicNext = 0;
  function bpm() { return 92 + Math.max(0, speed - 380) * 0.14; }
  function scheduleMusic() {
    if (!AC || muted || state !== "play" || paused) { if (AC) musicNext = AC.currentTime + 0.05; return; }
    const ahead = AC.currentTime + 0.25;
    if (musicNext < AC.currentTime) musicNext = AC.currentTime + 0.02;
    while (musicNext < ahead) {
      const eighth = 30 / bpm();
      const bar = Math.floor(musicStep / 8) % 4, beat = musicStep % 8;
      const chord = PROG[bar], t = musicNext;
      const danger = Math.min(1, (speed - 380) / 450);
      if (beat === 0 || beat === 4) { note(mtof(chord[0] - 12), t, eighth * 1.8, "sawtooth", 0.16, musicBus); note(120, t, 0.12, "sine", 0.35, musicBus, 40); }
      if (beat % 2 === 1) hiss(t, 0.04, 0.06 + danger * 0.06, 7000, musicBus);
      if (danger > 0.35 && (beat === 2 || beat === 6)) hiss(t, 0.12, 0.18, 1800, musicBus, "bandpass");
      const arp = chord[[0, 1, 2, 3, 2, 1, 2, 3][beat]] + 12;
      note(mtof(arp), t, eighth * 0.9, "triangle", 0.07 + danger * 0.03, musicBus);
      if (danger > 0.6 && beat % 2 === 0) note(mtof(arp + 12), t, eighth * 0.5, "square", 0.025, musicBus);
      musicNext += eighth; musicStep++;
    }
  }

  // ---------- input ----------
  const keys = new Set();
  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k === "escape") return;   // the arcade's key, never the game's
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
    initAudio();
    if (k === "m") { muted = !muted; return; }
    const fresh = !keys.has(k); keys.add(k);
    if ((state === "title" && (k === "enter" || k === " ")) || (state === "over" && k === "enter" && overT > 0.9)) { start(); return; }
    if (state === "play" && k === "p") paused = !paused;
    if (state === "play" && !paused && fresh && (k === " " || k === "arrowup" || k === "w")) jump();
  });
  addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
  addEventListener("blur", () => keys.clear());
  canvas.addEventListener("mousedown", () => {
    initAudio();
    if (state === "title" || (state === "over" && overT > 0.9)) start();
    else if (state === "play" && !paused) jump();
  });

  // ---------- the meadow ----------
  const blades = [];
  for (let i = 0; i < 260; i++) blades.push({ x: rand(0, VW + 60), h: rand(14, 34), lean: rand(-0.2, 0.2), hue: rand(70, 100), row: Math.random() });
  const clouds = [];
  for (let i = 0; i < 7; i++) clouds.push({ x: rand(0, VW), y: rand(40, 190), s: rand(0.6, 1.4) });
  function hill(off, amp, base, wl, color) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(-10, VH);
    for (let x = -10; x <= VW + 10; x += 12) {
      const u = (x + off) / wl;
      ctx.lineTo(x, base - Math.sin(u) * amp - Math.sin(u * 2.3 + 1) * amp * 0.4);
    }
    ctx.lineTo(VW + 10, VH); ctx.fill();
  }

  // ---------- state ----------
  let state = "title", paused = false, clock = 0, overT = 0;
  let dog, things = [], parts = [], popups = [];
  let speed = 380, dist = 0, score = 0, bonus = 0, best = 0, cells = 3, spawnIn = 1, shake = 0, banner = null, scroll = 0;
  try { best = +localStorage.getItem("meadowDashBest") || 0; } catch (e) {}

  function start() {
    state = "play"; paused = false;
    dog = { y: GROUND, vy: 0, jumps: 0, slide: 0, inv: 0, run: 0, ant: 0, antV: 0 };
    things = []; parts = []; popups = [];
    speed = 380; dist = 0; score = 0; bonus = 0; cells = 3; spawnIn = 1.2; scroll = 0;
    banner = { t: 2.6, a: "RUN!", b: "Space to jump (twice for a double)  ·  Down to slide" };
    musicStep = 0; if (AC) musicNext = AC.currentTime + 0.1;
    sfx.bark();
  }

  function jump() {
    if (dog.jumps < 2) {
      dog.vy = dog.jumps === 0 ? -880 : -760; dog.jumps++; dog.slide = 0; dog.antV -= 14;
      (dog.jumps === 1 ? sfx.jump : sfx.double)();
      for (let i = 0; i < 10; i++) parts.push({ x: 180, y: dog.y, vx: rand(-120, 40), vy: rand(-60, 20), life: 0.4, max: 0.4, c: "rgba(255,230,180,", s: rand(2, 4) });
    }
  }

  function spawn() {
    const r = Math.random();
    const x = VW + 60;
    if (r < 0.32) things.push({ kind: "rock", x, w: rand(34, 52), h: rand(26, 40) });
    else if (r < 0.52) things.push({ kind: "fence", x, w: 26, h: rand(52, 70) });
    else if (r < 0.72 && dist > 600) things.push({ kind: "crow", x, y: GROUND - rand(64, 74), w: 40, h: 22, flap: 0 });
    else {
      // an arc of bolts: worth jumping for
      const n = 5, high = Math.random() < 0.5;
      for (let i = 0; i < n; i++) things.push({ kind: "bolt", x: x + i * 46, y: GROUND - 40 - (high ? Math.sin(i / (n - 1) * Math.PI) * 130 : 0), w: 18, h: 18 });
    }
    const gap = Math.max(0.55, 1.35 - (speed - 380) / 700);
    spawnIn = gap * rand(0.8, 1.3);
  }

  function hurt() {
    if (dog.inv > 0) return;
    cells--; dog.inv = 1.4; shake = 14; sfx.hit();
    for (let i = 0; i < 40; i++) parts.push({ x: 190, y: dog.y - 20, vx: rand(-260, 260), vy: rand(-300, 60), life: 0.8, max: 0.8, c: "rgba(120,200,255,", s: rand(2, 5), g: 600 });
    if (cells <= 0) {
      state = "over"; overT = 0;
      if (score > best) { best = score; try { localStorage.setItem("meadowDashBest", String(best)); } catch (e) {} }
    }
  }

  // ---------- update ----------
  function update(dt) {
    speed = Math.min(900, speed + 9 * dt);
    dist += speed * dt; scroll += speed * dt;
    score = Math.floor(dist / 10) + bonus;
    const sliding = keys.has("arrowdown") || keys.has("s");
    if (sliding && dog.y >= GROUND && dog.slide <= 0) { dog.slide = 0.01; sfx.slide(); }
    if (dog.slide > 0) { dog.slide += dt; if (!sliding && dog.slide > 0.35) dog.slide = 0; }
    dog.vy += 2500 * dt; if (sliding && dog.y < GROUND) dog.vy += 2200 * dt;   // Down in the air drops you fast
    dog.y += dog.vy * dt;
    if (dog.y >= GROUND) { if (dog.vy > 600) shake = Math.max(shake, 3); dog.y = GROUND; dog.vy = 0; dog.jumps = 0; }
    dog.run += dt * speed / 40;
    dog.inv = Math.max(0, dog.inv - dt);
    // the antenna wags on a spring
    dog.antV += (-dog.ant * 90 - dog.antV * 6) * dt + Math.sin(clock * 9) * 22 * dt;
    dog.ant += dog.antV * dt;

    spawnIn -= dt; if (spawnIn <= 0) spawn();
    const low = dog.slide > 0;
    const box = { x: 150, y: dog.y - (low ? 26 : 50), w: low ? 76 : 58, h: low ? 26 : 50 };
    for (let i = things.length - 1; i >= 0; i--) {
      const t = things[i]; t.x -= speed * dt;
      if (t.kind === "crow") { t.flap += dt * 14; t.y += Math.sin(clock * 5 + t.x * 0.01) * 18 * dt; }
      if (t.x < -80) { things.splice(i, 1); continue; }
      const tb = t.kind === "rock" || t.kind === "fence" ? { x: t.x, y: GROUND - t.h, w: t.w, h: t.h } : { x: t.x - t.w / 2, y: t.y - t.h / 2, w: t.w, h: t.h };
      const touch = box.x < tb.x + tb.w - 6 && box.x + box.w > tb.x + 6 && box.y < tb.y + tb.h - 4 && box.y + box.h > tb.y + 4;
      if (!touch) continue;
      if (t.kind === "bolt") {
        bonus += 25; score += 25; popups.push({ x: t.x, y: t.y, t: 0.7, text: "+25" }); sfx.get();
        for (let k = 0; k < 10; k++) parts.push({ x: t.x, y: t.y, vx: rand(-150, 150), vy: rand(-150, 150), life: 0.5, max: 0.5, c: "rgba(255,220,90,", s: rand(2, 4) });
        things.splice(i, 1);
      } else if (!t.hit) { t.hit = true; hurt(); }
    }
    // dust behind the paws
    if (dog.y >= GROUND && Math.random() < 0.6) parts.push({ x: 150, y: GROUND, vx: -speed * 0.3 + rand(-30, 30), vy: rand(-60, -10), life: 0.5, max: 0.5, c: "rgba(255,200,150,", s: rand(1.5, 3.5) });
    if (Math.floor(dist / 2500) !== Math.floor((dist - speed * dt) / 2500)) {
      banner = { t: 1.6, a: Math.floor(dist / 2500) * 250 + " m", b: "the band picks up the pace" };
      sfx.bark();
    }
  }

  function ambient(dt) {
    clock += dt; shake *= Math.exp(-8 * dt);
    if (state === "over") overT += dt;
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    if (state !== "play") scroll += 120 * dt;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let i = popups.length - 1; i >= 0; i--) { popups[i].t -= dt; popups[i].y -= 40 * dt; if (popups[i].t <= 0) popups.splice(i, 1); }
    scheduleMusic();
  }

  // ---------- drawing ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#2a1848"); g.addColorStop(0.45, "#a3416b"); g.addColorStop(0.72, "#f08a52"); g.addColorStop(1, "#ffcf7a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function drawWorld() {
    // the sun, sitting on the far hills
    const sx = VW * 0.68, sy = 300;
    const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 230);
    sg.addColorStop(0, "rgba(255,245,200,0.95)"); sg.addColorStop(0.25, "rgba(255,190,110,0.55)"); sg.addColorStop(1, "rgba(255,140,90,0)");
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 230, 0, TAU); ctx.fill();
    ctx.fillStyle = "#fff2c4"; ctx.beginPath(); ctx.arc(sx, sy, 56, 0, TAU); ctx.fill();
    for (const c of clouds) {
      const x = ((c.x - scroll * 0.05 * c.s) % (VW + 300) + VW + 300) % (VW + 300) - 150;
      ctx.fillStyle = "rgba(255,190,200,0.35)";
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.ellipse(x + k * 34 * c.s, c.y + (k % 2) * 6, 40 * c.s, 14 * c.s, 0, 0, TAU); ctx.fill(); }
    }
    hill(scroll * 0.1, 26, 330, 160, "#7d3f73");
    hill(scroll * 0.25 + 300, 22, 360, 120, "#5a2f5e");
    hill(scroll * 0.5 + 700, 14, 395, 90, "#4d6a3a");
    // the field, with the wind rolling through it like waves
    const fg = ctx.createLinearGradient(0, 390, 0, VH);
    fg.addColorStop(0, "#7c9a3c"); fg.addColorStop(1, "#3d5a22");
    ctx.fillStyle = fg; ctx.fillRect(-10, 395, VW + 20, VH - 395);
    ctx.fillStyle = "rgba(255,230,140,0.12)";
    for (let k = 0; k < 4; k++) {
      const wx = (((clock * 260 + k * 320) - scroll * 0.6) % (VW + 400) + VW + 400) % (VW + 400) - 200;
      ctx.beginPath(); ctx.ellipse(wx, 430 + k * 22, 160, 12, 0, 0, TAU); ctx.fill();
    }
  }

  function drawBlades(front) {
    ctx.lineCap = "round";
    for (const b of blades) {
      if ((b.row > 0.6) !== front) continue;
      const par = front ? 1.15 : 0.8;
      const x = ((b.x - scroll * par) % (VW + 60) + VW + 60) % (VW + 60) - 30;
      const y = front ? VH - 8 - b.row * 40 : 400 + b.row * 60;
      const wave = Math.sin(x * 0.012 - clock * 2.4) * 0.5 + b.lean;
      ctx.strokeStyle = `hsl(${b.hue},${front ? 55 : 45}%,${front ? 30 : 42}%)`;
      ctx.lineWidth = front ? 3 : 2;
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + wave * b.h * 0.5, y - b.h * 0.6, x + wave * b.h, y - b.h * (front ? 1.4 : 1));
      ctx.stroke();
    }
  }

  function drawDog() {
    if (!dog) return;
    if (dog.inv > 0 && Math.floor(clock * 14) % 2 === 0) return;
    const low = dog.slide > 0;
    ctx.save(); ctx.translate(180, dog.y);
    if (low) ctx.scale(1.2, 0.6);
    const air = dog.y < GROUND;
    // legs
    ctx.strokeStyle = "#4f5e78"; ctx.lineWidth = 5; ctx.lineCap = "round";
    for (let i = 0; i < 4; i++) {
      const lx = [-20, -10, 12, 22][i], ph = dog.run + (i % 2) * Math.PI;
      const swing = air ? (i < 2 ? -0.6 : 0.6) : Math.sin(ph) * 0.7;
      ctx.beginPath(); ctx.moveTo(lx, -16); ctx.lineTo(lx + Math.sin(swing) * 12, -16 + Math.cos(swing) * 16); ctx.stroke();
    }
    // body
    ctx.fillStyle = "#9fb3d1";
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-30, -40, 60, 26, 10) : ctx.rect(-30, -40, 60, 26); ctx.fill();
    ctx.fillStyle = "#c9d7ee"; ctx.fillRect(-22, -36, 30, 6);
    // a little power cell on its back, the lives
    for (let i = 0; i < 3; i++) { ctx.fillStyle = i < cells ? "#5dff8a" : "#3a4458"; ctx.fillRect(-18 + i * 9, -46, 7, 6); }
    // tail
    ctx.strokeStyle = "#9fb3d1"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-30, -34); ctx.lineTo(-42, -44 + Math.sin(clock * 18) * 4); ctx.stroke();
    // head
    ctx.fillStyle = "#b5c6e2";
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(18, -58, 30, 24, 8) : ctx.rect(18, -58, 30, 24); ctx.fill();
    ctx.fillStyle = "#7d8fb0"; ctx.beginPath(); ctx.moveTo(22, -56); ctx.lineTo(18, -68); ctx.lineTo(30, -58); ctx.fill();
    ctx.fillStyle = "#1a2236"; ctx.fillRect(36, -52, 12, 8);
    ctx.fillStyle = `rgba(120,255,200,${0.7 + 0.3 * Math.sin(clock * 6)})`; ctx.fillRect(39, -50, 3, 4); ctx.fillRect(44, -50, 3, 4);
    // the wagging antenna
    ctx.strokeStyle = "#dfe8f7"; ctx.lineWidth = 2;
    const ax = 30 + Math.sin(dog.ant) * 16, ay = -58 - Math.cos(dog.ant) * 18;
    ctx.beginPath(); ctx.moveTo(30, -58); ctx.lineTo(ax, ay); ctx.stroke();
    ctx.fillStyle = "#ff5a7a"; ctx.beginPath(); ctx.arc(ax, ay, 3.5, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawThing(t) {
    if (t.kind === "rock") {
      ctx.fillStyle = "#6e6178";
      ctx.beginPath(); ctx.moveTo(t.x, GROUND); ctx.lineTo(t.x + 6, GROUND - t.h * 0.8); ctx.lineTo(t.x + t.w * 0.45, GROUND - t.h); ctx.lineTo(t.x + t.w - 4, GROUND - t.h * 0.6); ctx.lineTo(t.x + t.w, GROUND); ctx.fill();
      ctx.fillStyle = "rgba(255,200,150,0.35)"; ctx.beginPath(); ctx.moveTo(t.x + 8, GROUND - t.h * 0.78); ctx.lineTo(t.x + t.w * 0.45, GROUND - t.h); ctx.lineTo(t.x + t.w * 0.5, GROUND - t.h * 0.7); ctx.fill();
    } else if (t.kind === "fence") {
      ctx.fillStyle = "#8a5a3a"; ctx.fillRect(t.x, GROUND - t.h, 8, t.h); ctx.fillRect(t.x + t.w - 8, GROUND - t.h, 8, t.h);
      ctx.fillStyle = "#a8714a"; ctx.fillRect(t.x - 4, GROUND - t.h + 8, t.w + 8, 7); ctx.fillRect(t.x - 4, GROUND - t.h * 0.5, t.w + 8, 7);
    } else if (t.kind === "crow") {
      ctx.save(); ctx.translate(t.x, t.y);
      ctx.fillStyle = "#231a2e"; ctx.beginPath(); ctx.ellipse(0, 0, 16, 8, 0, 0, TAU); ctx.fill();
      const f = Math.sin(t.flap) * 12;
      ctx.beginPath(); ctx.moveTo(-4, -2); ctx.lineTo(-14, -8 - f); ctx.lineTo(8, -2); ctx.fill();
      ctx.fillStyle = "#ffb03a"; ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(-24, 2); ctx.lineTo(-16, 4); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.fillRect(-11, -3, 2, 2);
      ctx.restore();
    } else {
      ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(clock * 3);
      ctx.globalCompositeOperation = "lighter";
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 20); g.addColorStop(0, "rgba(255,220,90,0.6)"); g.addColorStop(1, "rgba(255,220,90,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#ffd85a";
      for (let i = 0; i < 6; i++) { ctx.rotate(TAU / 6); ctx.fillRect(-2.5, -10, 5, 5); }
      ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, TAU); ctx.fill();
      ctx.fillStyle = "#8a6a10"; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  function text(t, x, y, size, color, align = "center", weight = 700) {
    ctx.font = `${weight} ${size}px "Segoe UI", system-ui, sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillStyle = color; ctx.fillText(t, x, y);
  }
  function glow(t, x, y, size, color, shadow) {
    ctx.save(); ctx.shadowColor = shadow; ctx.shadowBlur = size * 0.5; text(t, x, y, size, color, "center", 800); ctx.restore();
    text(t, x, y, size, color, "center", 800);
  }

  function draw() {
    drawSky();
    ctx.save();
    if (shake > 0.3) ctx.translate(rand(-shake, shake), rand(-shake, shake));
    ctx.translate(OX, OY); ctx.scale(S, S);
    drawWorld();
    drawBlades(false);
    for (const t of things) drawThing(t);
    if (state !== "title") drawDog();
    for (const p of parts) { const k = p.life / p.max; ctx.fillStyle = p.c + k + ")"; ctx.fillRect(p.x, p.y, p.s, p.s); }
    drawBlades(true);
    for (const p of popups) text(p.text, p.x, p.y, 16, `rgba(255,240,170,${Math.min(1, p.t * 2)})`);

    if (state === "play") {
      text(score + "", 24, 30, 26, "#fff4dc", "left", 800);
      text("BEST " + Math.max(best, score), 24, 56, 14, "rgba(255,244,220,0.7)", "left", 600);
      text(Math.round(bpm()) + " bpm" + (muted ? "  (muted - M)" : "  ·  M mutes"), VW - 24, 30, 15, "rgba(255,244,220,0.75)", "right", 600);
      if (banner) {
        ctx.globalAlpha = Math.min(1, banner.t * 2);
        glow(banner.a, VW / 2, 150, 46, "#fff4dc", "rgba(255,120,80,0.9)");
        if (banner.b) text(banner.b, VW / 2, 192, 17, "rgba(255,240,230,0.9)", "center", 500);
        ctx.globalAlpha = 1;
      }
      if (paused) { ctx.fillStyle = "rgba(20,10,30,0.5)"; ctx.fillRect(0, 0, VW, VH); glow("PAUSED", VW / 2, VH / 2, 50, "#fff", "#f8a"); }
    } else if (state === "title") {
      glow("MEADOW DASH", VW / 2, 130, 72, "#fff4dc", "rgba(255,110,90,1)");
      text("a robot dog runs Elise's grassland at sunset", VW / 2, 182, 20, "rgba(255,240,230,0.92)", "center", 500);
      text("The band plays along - and the faster you go, the faster it plays.", VW / 2, 214, 17, "rgba(255,240,230,0.85)", "center", 500);
      text("Space, Up or a click to jump (twice for a double)  ·  Down to slide under the crows", VW / 2, 244, 15, "rgba(255,240,230,0.75)", "center", 500);
      text("Press Enter or Space to run", VW / 2, 300, 28, `rgba(255,250,235,${0.55 + 0.45 * Math.sin(clock * 4)})`);
      if (best) text("Best: " + best, VW / 2, 334, 17, "rgba(255,244,220,0.8)");
    } else {
      ctx.fillStyle = `rgba(30,12,40,${Math.min(0.5, overT)})`; ctx.fillRect(0, 0, VW, VH);
      glow("OUT OF BATTERY", VW / 2, 170, 54, "#fff4dc", "rgba(255,90,90,1)");
      text("Score " + score + (score >= best && score > 0 ? "  ·  new best!" : "  ·  best " + best), VW / 2, 222, 22, "#fff0e8");
      text(Math.floor(dist / 10) + " m across the meadow", VW / 2, 252, 17, "rgba(255,240,230,0.8)", "center", 500);
      if (overT > 0.9) text("Press Enter to run again", VW / 2, 310, 26, `rgba(255,250,235,${0.55 + 0.45 * Math.sin(clock * 4)})`);
    }
    ctx.restore();
    if (state === "title") text(TAG, W - 14, H - 14, Math.max(11, Math.min(W, H) * 0.018), "rgba(255,244,220,0.6)", "right", 500);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (state === "play" && !paused) update(dt);
    ambient(state === "play" && paused ? 0 : dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
