+DirectoriesToAlwaysCook=(Path="/Game/SlotFactory/SymbolSprites")
+DirectoriesToAlwaysCook=(Path="/Game/Cards")
+DirectoriesToAlwaysCook=(Path="/Game/EchoContent/Characters")
+DirectoriesToAlwaysCook=(Path="/Game/SlotFactory/Materials")
