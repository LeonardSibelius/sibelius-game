+DirectoriesToAlwaysCook=(Path="/Game/Audio/Dancers")
; GS_Idle_MH - the pose a guide stands in once she is past dancing. The dances are
; hard-referenced on the component's CDO instead, which is the better way and NOT
; available here: an FObjectFinder on this folder crashes the editor during CDO
; construction (see the note in DancerAgentComponent.cpp). Loaded on demand, cooked here.
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Retargeting/Combat")
; ASpaceport's parts (docs/SPACEPORT_PLAN.md Phase B). Spaceport.cpp names three meshes
; from these gitignored vendor packs by PATH, and a soft path in C++ is not a package
; reference - the cooker does not follow it. Without these four lines the spaceport
; assembles perfectly in PIE and is INVISIBLE to every player who downloads the game.
; That is the v0.7.4 bug verbatim. Materials as well as meshes, or it ships untextured.
+DirectoriesToAlwaysCook=(Path="/Game/ModularSciFiEnv_F/Meshes")
+DirectoriesToAlwaysCook=(Path="/Game/ModularSciFiEnv_F/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/ModularSciFiEnv_J/Meshes")
+DirectoriesToAlwaysCook=(Path="/Game/ModularSciFiEnv_J/Materials")
