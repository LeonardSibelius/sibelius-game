; v0.9.7.1: optional game copies of Niagara Fluids templates + M_SauceSurface.
; Plugin templates cook via C++ FObjectFinder; this folder is the retint copies
; from Tools/Scripts/build_sauce_fluids.py (a scan is not a reference).
+DirectoriesToAlwaysCook=(Path="/Game/Sauce")

; THE BATTLE AVATAR. UBattleFormComponent points AvatarMesh and AvatarAnimClass at
; Greystone with SOFT pointers set in C++ - and a soft path in code is not a package
; reference, so the cooker never follows it. USlapComponent loads his Attack_Primary
; montages by string path at runtime, which is not a reference either. Without this line
; a packaged build enters battle form with no hero and no sword, logs
; "[BattleForm] avatar mesh failed to load", and looks exactly like a bug.
;
; This is the same trap ParagonGideon avoids by being hard-referenced through
; FObjectFinder in SlapComponent/RefuserController (docs/VENDOR_PACKS.md). Greystone has
; no such reference, so the directory is named here instead.
;
; The HERO folder only, not the whole 2.2 GB pack: the cooker follows dependencies out of
; it for the global materials and skins it actually needs.
+DirectoriesToAlwaysCook=(Path="/Game/ParagonGreystone/Characters/Heroes/Greystone")
; Cutscene video for AVideoCue (docs/CINEMATICS.md). Media is read from DISK at
; runtime, never from the pak - miss this line and the cutscene plays in PIE and is
; silently absent from the shipped build.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Movies")
+DirectoriesToAlwaysStageAsNonUFS=(Path="WebGame")
+DirectoriesToAlwaysStageAsNonUFS=(Path="Journal")
+DirectoriesToAlwaysStageAsNonUFS=(Path="Data")
