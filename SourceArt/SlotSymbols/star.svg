<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Star">
 <title>Star — stellar light through a telescope</title>
 <desc>A brilliant warm-white stellar point with a golden light halo, delicate diffraction spikes and faint optical rings. Original telescope-inspired illustration.</desc>
 <defs>
  <radialGradient id="star-halo"><stop stop-color="#fffae2" stop-opacity=".96"/><stop offset=".1" stop-color="#fff2be" stop-opacity=".85"/><stop offset=".23" stop-color="#ffd680" stop-opacity=".5"/><stop offset=".42" stop-color="#e9a44a" stop-opacity=".2"/><stop offset=".66" stop-color="#bc7737" stop-opacity=".065"/><stop offset="1" stop-color="#6b503f" stop-opacity="0"/></radialGradient>
  <radialGradient id="star-bloom"><stop offset=".08" stop-color="#fff"/><stop offset=".3" stop-color="#fffdeb"/><stop offset=".48" stop-color="#fff0c2" stop-opacity=".98"/><stop offset=".7" stop-color="#ffd984" stop-opacity=".58"/><stop offset="1" stop-color="#e8a550" stop-opacity="0"/></radialGradient>
  <radialGradient id="star-point"><stop offset=".3" stop-color="#fff"/><stop offset=".64" stop-color="#fffff6"/><stop offset=".86" stop-color="#fff9d9" stop-opacity=".8"/><stop offset="1" stop-color="#ffe6a0" stop-opacity="0"/></radialGradient>
  <linearGradient id="star-spike" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffbd5f" stop-opacity="0"/><stop offset=".18" stop-color="#f2c785" stop-opacity=".15"/><stop offset=".38" stop-color="#ffe8b0" stop-opacity=".65"/><stop offset=".5" stop-color="#fffef2"/><stop offset=".62" stop-color="#ffe8b0" stop-opacity=".65"/><stop offset=".82" stop-color="#f2c785" stop-opacity=".15"/><stop offset="1" stop-color="#ffbd5f" stop-opacity="0"/></linearGradient>
  <linearGradient id="star-fine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dae5ff" stop-opacity="0"/><stop offset=".25" stop-color="#ffefc9" stop-opacity=".3"/><stop offset=".5" stop-color="#fff"/><stop offset=".75" stop-color="#ffefc9" stop-opacity=".3"/><stop offset="1" stop-color="#dae5ff" stop-opacity="0"/></linearGradient>
  <filter id="star-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="star-ring-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".75"/></filter>
  <g id="star-ray">
   <path d="M9 100Q84 98.8 100 95Q116 98.8 191 100Q116 101.2 100 105Q84 101.2 9 100Z" fill="url(#star-spike)" opacity=".72" filter="url(#star-soft)"/>
   <path d="M9 100Q87 99.8 100 98.1Q113 99.8 191 100Q113 100.2 100 101.9Q87 100.2 9 100Z" fill="url(#star-spike)"/>
   <path d="M9 100H191" fill="none" stroke="url(#star-fine)" stroke-width=".48"/>
  </g>
 </defs>
 <!-- Optical light, not a solid five-pointed object. All effects are static. -->
 <circle cx="100" cy="100" r="94" fill="url(#star-halo)"/>
 <g fill="none" filter="url(#star-ring-soft)">
  <circle cx="100" cy="100" r="26" stroke="#ffe6b1" stroke-width=".8" opacity=".14"/>
  <circle cx="100" cy="100" r="38" stroke="#c3d8ed" stroke-width="1.3" opacity=".055"/>
  <circle cx="100" cy="100" r="49" stroke="#d4a470" stroke-width="1.5" opacity=".055"/>
 </g>
 <use href="#star-ray" transform="rotate(15 100 100)"/>
 <use href="#star-ray" transform="rotate(75 100 100)"/>
 <use href="#star-ray" transform="rotate(135 100 100)"/>
 <g opacity=".19" transform="rotate(-15 100 100)"><path d="M27 100H173" stroke="url(#star-fine)" stroke-width=".8"/></g>
 <circle cx="100" cy="100" r="27" fill="url(#star-bloom)"/>
 <circle cx="100" cy="100" r="12" fill="url(#star-point)"/>
 <g fill="#d9e8f5">
  <circle cx="35" cy="43" r=".7" opacity=".56"/>
  <circle cx="153" cy="39" r=".55" opacity=".38"/>
  <circle cx="164" cy="143" r=".8" opacity=".5"/>
  <circle cx="47" cy="160" r=".6" opacity=".4"/>
 </g>
</svg>
