<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Sun">
<title>Sun — living solar fire</title>
<desc>A golden-orange Sun with mottled photosphere, sunspots, a compact flare kernel, and volumetric limb prominences: magnetic loops and eruptive plasma with bright cores, not outline strokes.</desc>
<defs>
 <clipPath id="sun-disc"><circle cx="100" cy="100" r="67"/></clipPath>
 <radialGradient id="sun-corona"><stop offset=".48" stop-color="#ffc14a" stop-opacity=".5"/><stop offset=".62" stop-color="#ff8a18" stop-opacity=".42"/><stop offset=".78" stop-color="#ff4e0a" stop-opacity=".16"/><stop offset="1" stop-color="#ef2608" stop-opacity="0"/></radialGradient>
 <radialGradient id="sun-surface" cx=".42" cy=".4" r=".66"><stop stop-color="#ffdb73"/><stop offset=".35" stop-color="#ffbb42"/><stop offset=".7" stop-color="#ed8a19"/><stop offset=".91" stop-color="#d75a0d"/><stop offset="1" stop-color="#ac3209"/></radialGradient>
 <radialGradient id="sun-limb"><stop offset=".91" stop-color="#ffba35" stop-opacity="0"/><stop offset=".984" stop-color="#ffd561" stop-opacity=".48"/><stop offset="1" stop-color="#fff1ac" stop-opacity=".85"/></radialGradient>
 <radialGradient id="sun-active"><stop stop-color="#fff5c6" stop-opacity=".8"/><stop offset=".3" stop-color="#ffda70" stop-opacity=".55"/><stop offset="1" stop-color="#ffb72b" stop-opacity="0"/></radialGradient>
 <radialGradient id="sun-spot"><stop stop-color="#573513"/><stop offset=".25" stop-color="#7a4314"/><stop offset=".57" stop-color="#b16b20" stop-opacity=".8"/><stop offset="1" stop-color="#d58a31" stop-opacity="0"/></radialGradient>
 <linearGradient id="sun-flare-ne" x1="140" y1="70" x2="178" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#fff6d0"/><stop offset=".28" stop-color="#ffb14a"/><stop offset=".62" stop-color="#ff5a18"/><stop offset="1" stop-color="#c01808" stop-opacity="0"/></linearGradient>
 <linearGradient id="sun-flare-se" x1="150" y1="120" x2="176" y2="168" gradientUnits="userSpaceOnUse"><stop stop-color="#fff1c0"/><stop offset=".3" stop-color="#ff8a28"/><stop offset=".7" stop-color="#e8380c"/><stop offset="1" stop-color="#9a1008" stop-opacity="0"/></linearGradient>
 <linearGradient id="sun-flare-sw" x1="50" y1="120" x2="20" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#ffe9b0"/><stop offset=".35" stop-color="#ff7020"/><stop offset="1" stop-color="#b01408" stop-opacity="0"/></linearGradient>
 <linearGradient id="sun-flare-n" x1="100" y1="40" x2="100" y2="8" gradientUnits="userSpaceOnUse"><stop stop-color="#fff0c4"/><stop offset=".4" stop-color="#ff7a22"/><stop offset="1" stop-color="#c01808" stop-opacity="0"/></linearGradient>
 <radialGradient id="sun-kernel" cx=".4" cy=".4" r=".6"><stop stop-color="#ffffff"/><stop offset=".28" stop-color="#fff4c4"/><stop offset=".55" stop-color="#ffcf6a"/><stop offset="1" stop-color="#ff5a12" stop-opacity="0"/></radialGradient>
 <filter id="sun-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6"/></filter>
 <filter id="sun-bloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.2"/></filter>
 <filter id="sun-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".55"/></filter>
 <filter id="sun-granules" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="15"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="3.2" intercept="-1.1"/><feFuncG type="linear" slope="3.2" intercept="-1.1"/><feFuncB type="linear" slope="3.2" intercept="-1.1"/></feComponentTransfer></filter>
 <filter id="sun-plasma" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".16" numOctaves="4" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="3" intercept="-1"/><feFuncG type="linear" slope="3" intercept="-1"/><feFuncB type="linear" slope="3" intercept="-1"/></feComponentTransfer></filter>
 <filter id="sun-wisp" x="-30%" y="-30%" width="160%" height="160%">
  <feTurbulence type="fractalNoise" baseFrequency=".38" numOctaves="3" seed="11" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  <feGaussianBlur stdDeviation=".35"/>
 </filter>
</defs>
<circle cx="100" cy="100" r="98" fill="url(#sun-corona)"/>
<g filter="url(#sun-bloom)" opacity=".5">
 <path fill="#ff2a00" fill-rule="evenodd" d="M130 44C148 16 182 22 190 56C196 76 176 88 158 78C144 70 132 56 130 44M140 50C152 34 172 38 178 56C182 68 168 74 156 68C146 64 140 56 140 50Z"/>
 <path fill="#ff2a00" fill-rule="evenodd" d="M148 112C172 104 198 136 186 168C176 184 154 172 148 148C144 132 144 118 148 112M156 118C172 114 186 136 178 158C172 168 158 160 154 142C152 130 152 122 156 118Z"/>
 <path fill="#ff2a00" fill-rule="evenodd" d="M52 112C28 104 2 136 14 168C24 184 46 172 52 148C56 132 56 118 52 112M44 118C28 114 14 136 22 158C28 168 42 160 46 142C48 130 48 122 44 118Z"/>
 <path fill="#ff2a00" fill-rule="evenodd" d="M78 36C88 12 120 10 132 36C138 50 122 58 104 50C90 44 80 40 78 36M86 40C94 26 114 26 120 40C124 48 112 52 100 46C92 42 86 42 86 40Z"/>
</g>
<g filter="url(#sun-wisp)" opacity=".95">
 <!-- Closed magnetic arches: two footpoints on the limb, plasma out and back. -->
 <path fill="url(#sun-flare-ne)" fill-rule="evenodd" d="M132 46C150 18 184 24 190 58C196 76 176 86 158 76C144 68 134 56 132 46M142 52C154 36 174 40 180 58C184 68 170 74 158 68C148 64 142 56 142 52Z"/>
 <path fill="url(#sun-flare-se)" fill-rule="evenodd" d="M150 114C174 106 198 138 186 168C176 182 156 170 150 148C146 134 146 120 150 114M158 120C174 116 186 138 178 158C172 166 160 158 156 142C154 132 154 124 158 120Z"/>
 <path fill="url(#sun-flare-sw)" fill-rule="evenodd" d="M50 114C26 106 2 138 14 168C24 182 44 170 50 148C54 134 54 120 50 114M42 120C26 116 14 138 22 158C28 166 40 158 44 142C46 132 46 124 42 120Z"/>
 <path fill="url(#sun-flare-n)" fill-rule="evenodd" d="M80 38C90 14 122 12 132 38C138 50 122 56 104 48C90 42 82 40 80 38M88 42C96 28 116 28 122 42C126 48 114 52 102 46C94 42 88 42 88 42Z"/>
</g>
<g fill="none" stroke-linecap="round" opacity=".9" filter="url(#sun-soft)">
 <path d="M136 48C154 26 180 32 186 60" stroke="#fff3c4" stroke-width="2.2"/>
 <path d="M154 116C174 110 192 138 180 162" stroke="#ffe7a8" stroke-width="1.9"/>
 <path d="M46 116C26 110 8 138 20 162" stroke="#ffe7a8" stroke-width="1.8"/>
 <path d="M84 40C96 22 118 22 128 40" stroke="#fff0c0" stroke-width="1.7"/>
</g>
<circle cx="100" cy="100" r="67" fill="url(#sun-surface)"/>
<g clip-path="url(#sun-disc)">
 <rect x="33" y="33" width="134" height="134" filter="url(#sun-plasma)" opacity=".39" style="mix-blend-mode:soft-light"/>
 <rect x="33" y="33" width="134" height="134" filter="url(#sun-granules)" opacity=".33" style="mix-blend-mode:soft-light"/>
 <ellipse cx="136" cy="58" rx="19" ry="12" fill="url(#sun-active)" transform="rotate(-35 136 58)"/>
 <ellipse cx="60" cy="135" rx="14" ry="10" fill="url(#sun-active)"/>
 <g transform="rotate(-38 130 58)">
  <ellipse cx="130" cy="58" rx="14" ry="8" fill="#ff3a0a" opacity=".4" filter="url(#sun-glow)"/>
  <ellipse cx="130" cy="58" rx="8" ry="4.6" fill="url(#sun-kernel)"/>
  <ellipse cx="129" cy="57" rx="3.2" ry="1.8" fill="#fff"/>
 </g>
 <ellipse cx="80" cy="91" rx="8" ry="5.5" fill="url(#sun-spot)" transform="rotate(-28 80 91)"/>
 <ellipse cx="91" cy="86" rx="4" ry="3" fill="url(#sun-spot)"/>
 <ellipse cx="119" cy="123" rx="4.3" ry="3.2" fill="url(#sun-spot)" transform="rotate(32 119 123)"/>
 <g fill="none" stroke-linecap="round" filter="url(#sun-soft)">
  <path d="M67 88Q71 73 83 79Q92 86 97 80M75 97Q87 102 98 92" stroke="#ffe797" stroke-width="1" opacity=".48"/>
  <path d="M110 123Q116 114 124 118Q130 122 130 129" stroke="#ffe297" stroke-width=".9" opacity=".53"/>
  <path d="M47 111C57 104 65 107 70 116S83 131 92 124M104 54C118 52 119 62 131 65" stroke="#914316" stroke-width="1.1" opacity=".33"/>
 </g>
 <circle cx="100" cy="100" r="67" fill="url(#sun-limb)"/>
</g>
<circle cx="100" cy="100" r="67" fill="none" stroke="#ffce5a" stroke-width=".5" opacity=".7"/>
</svg>
