    <radialGradient id="earth-ocean" cx=".31" cy=".24" r=".82"><stop stop-color="#40c2e5"/><stop offset=".27" stop-color="#168fc9"/><stop offset=".56" stop-color="#075ca5"/><stop offset=".8" stop-color="#04386e"/><stop offset="1" stop-color="#020d25"/></radialGradient>
    <linearGradient id="earth-land" x1=".1" y1="0" x2=".85" y2="1"><stop stop-color="#a6cba2"/><stop offset=".3" stop-color="#789977"/><stop offset=".58" stop-color="#b6aa70"/><stop offset=".76" stop-color="#498576"/><stop offset="1" stop-color="#254d48"/></linearGradient>
