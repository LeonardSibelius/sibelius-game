<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Saturn">
<title>Saturn — through the telescope</title>
<desc>A pale butterscotch Saturn with atmospheric belts, a multi-band ring system including the Cassini Division, ring shadow on the globe and globe shadow on the rings. Telescope-inspired original illustration.</desc>
<defs>
 <clipPath id="saturn-disc"><circle cx="100" cy="100" r="44"/></clipPath>
 <clipPath id="saturn-back"><rect x="-40" y="-40" width="280" height="142"/></clipPath>
 <clipPath id="saturn-front"><rect x="-40" y="98" width="280" height="142"/></clipPath>
 <radialGradient id="saturn-body" cx=".32" cy=".28" r=".8"><stop stop-color="#f4ead0"/><stop offset=".22" stop-color="#e2c888"/><stop offset=".5" stop-color="#c9a45a"/><stop offset=".78" stop-color="#9a7838"/><stop offset="1" stop-color="#5a4218"/></radialGradient>
 <linearGradient id="saturn-belts" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8bc78" stop-opacity="0"/><stop offset=".28" stop-color="#b89248" stop-opacity=".28"/><stop offset=".5" stop-color="#efe0b4" stop-opacity=".2"/><stop offset=".72" stop-color="#a07a38" stop-opacity=".32"/><stop offset="1" stop-color="#d8bc78" stop-opacity="0"/></linearGradient>
 <radialGradient id="saturn-shade" cx=".3" cy=".3" r=".82"><stop offset=".28" stop-color="#1a1208" stop-opacity="0"/><stop offset=".62" stop-color="#1a1208" stop-opacity=".04"/><stop offset=".82" stop-color="#120c06" stop-opacity=".28"/><stop offset="1" stop-color="#080604" stop-opacity=".72"/></radialGradient>
 <radialGradient id="saturn-limb"><stop offset=".9" stop-color="#f0e2bc" stop-opacity="0"/><stop offset=".98" stop-color="#f4ead0" stop-opacity=".22"/><stop offset="1" stop-color="#fff6dc" stop-opacity=".35"/></radialGradient>
 <linearGradient id="saturn-ring-a" x1="0" y1="0" x2="1" y2=".12"><stop stop-color="#5a4a30"/><stop offset=".12" stop-color="#d8ccaa"/><stop offset=".38" stop-color="#f4ead0"/><stop offset=".5" stop-color="#fff8e8"/><stop offset=".62" stop-color="#e8d8b0"/><stop offset=".88" stop-color="#8a7a58"/><stop offset="1" stop-color="#3a3018"/></linearGradient>
 <linearGradient id="saturn-ring-b" x1="0" y1="0" x2="1" y2=".12"><stop stop-color="#4a3c24"/><stop offset=".14" stop-color="#c4b48a"/><stop offset=".4" stop-color="#efe4c4"/><stop offset=".5" stop-color="#fffaf0"/><stop offset=".6" stop-color="#e0d0a4"/><stop offset=".86" stop-color="#7a6a48"/><stop offset="1" stop-color="#2a2010"/></linearGradient>
 <linearGradient id="saturn-ring-c" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c8b890" stop-opacity="0"/><stop offset=".2" stop-color="#c8b890" stop-opacity=".25"/><stop offset=".5" stop-color="#e8dcc0" stop-opacity=".4"/><stop offset=".8" stop-color="#c8b890" stop-opacity=".25"/><stop offset="1" stop-color="#c8b890" stop-opacity="0"/></linearGradient>
 <radialGradient id="saturn-ring-shadow" cx=".62" cy=".5" r=".55"><stop stop-color="#080604" stop-opacity=".65"/><stop offset=".45" stop-color="#080604" stop-opacity=".35"/><stop offset="1" stop-color="#080604" stop-opacity="0"/></radialGradient>
 <filter id="saturn-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".8"/></filter>
 <filter id="saturn-mottle" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".11" numOctaves="4" seed="19"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="2.8" intercept="-.9"/><feFuncG type="linear" slope="2.8" intercept="-.9"/><feFuncB type="linear" slope="2.8" intercept="-.9"/></feComponentTransfer></filter>
 <g id="saturn-rings" fill="none">
  <ellipse cx="100" cy="100" rx="58" ry="18.5" stroke="url(#saturn-ring-c)" stroke-width="5"/>
  <ellipse cx="100" cy="100" rx="74" ry="23.5" stroke="url(#saturn-ring-b)" stroke-width="12"/>
  <ellipse cx="100" cy="100" rx="84" ry="26.8" stroke="#1a140c" stroke-width="3.2"/>
  <ellipse cx="100" cy="100" rx="92" ry="29.4" stroke="url(#saturn-ring-a)" stroke-width="7"/>
  <ellipse cx="100" cy="100" rx="88" ry="28.1" stroke="#c4b490" stroke-width=".6" opacity=".35"/>
  <ellipse cx="100" cy="100" rx="70" ry="22.3" stroke="#6a5a38" stroke-width=".7" opacity=".4"/>
 </g>
</defs>
<g transform="rotate(-22 100 100)">
 <g clip-path="url(#saturn-back)">
  <use href="#saturn-rings" opacity=".85"/>
 </g>
 <circle cx="100" cy="100" r="44" fill="url(#saturn-body)"/>
 <g clip-path="url(#saturn-disc)">
  <ellipse cx="100" cy="88" rx="40" ry="10" fill="#efe4c0" opacity=".22"/>
  <ellipse cx="100" cy="100" rx="43" ry="44" fill="url(#saturn-belts)"/>
  <ellipse cx="100" cy="96" rx="42" ry="4" fill="#f4ead4" opacity=".16"/>
  <ellipse cx="100" cy="108" rx="40" ry="4.5" fill="#a07838" opacity=".2"/>
  <ellipse cx="100" cy="80" rx="28" ry="8" fill="#f0e6c8" opacity=".14"/>
  <rect x="56" y="56" width="88" height="88" filter="url(#saturn-mottle)" opacity=".18" style="mix-blend-mode:soft-light"/>
  <ellipse cx="100" cy="105" rx="43" ry="5" fill="#2a1c0c" opacity=".4" filter="url(#saturn-soft)"/>
  <ellipse cx="118" cy="108" rx="36" ry="14" fill="url(#saturn-ring-shadow)"/>
  <circle cx="100" cy="100" r="44" fill="url(#saturn-shade)"/>
  <circle cx="100" cy="100" r="44" fill="url(#saturn-limb)"/>
 </g>
 <g clip-path="url(#saturn-front)">
  <use href="#saturn-rings"/>
 </g>
</g>
</svg>
