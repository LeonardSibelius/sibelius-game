# Fly config for the NPC chat proxy.
#
# `fly launch` rewrote this file and stripped the comments; the settings all survived.
# They are restored here because each of the three below is load-bearing, and without
# the reasoning someone will eventually "tidy" one of them.
#
#   ONE MACHINE (no scale, HA off). The spend ledger is a file and the dedup table and
#   rate limiter live in memory. A second machine makes the $15 cap advisory.
#
#   ALWAYS ON (auto_stop off, min 1). A cold start costs seconds against a measured p50
#   of 957 ms. A player watching Kaia's face wait for a container is worse than the
#   couple of dollars auto-stop saves.
#
#   A DISK (the /data mount). A restart that reset the month's spend to zero would
#   remove the only control that stops at OUR number rather than Google's.
#
# See docs/NPC_CHAT_REVIEW.md and backend/README.md.

app = 'sibelius-npc-chat'
primary_region = 'sjc'

[build]
[env]
  BUDGET_FILE = '/data/budget.json'
  CHAT_DISABLED = '0'
  DAILY_CAP_USD = '0.75'
  GEMINI_MODEL = 'gemini-3.1-flash-lite'
  MAX_OUTPUT_TOKENS = '512'
  MONTHLY_CAP_USD = '15'
  PER_IP_PER_MINUTE = '12'
  PORT = '8787'
  UPSTREAM_TIMEOUT_MS = '20000'

[[mounts]]
  source = 'npcchat_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
