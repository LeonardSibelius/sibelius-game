# Fly config for the NPC chat proxy.
#
# `fly launch` rewrote this file and stripped the comments; the settings all survived.
# They are restored here because each of the three below is load-bearing, and without
# the reasoning someone will eventually "tidy" one of them.
#
#   ONE MACHINE (no scale, HA off). The spend ledger is a file and the dedup table and
#   rate limiter live in memory. A second machine makes the monthly cap advisory.
#
#   THE CAPS ARE AN EMERGENCY BRAKE, NOT A LIMIT (2026-10-06). Valve, on the chat review: "if
#   a feature is included in the game, it should be accessible for all users at all times."
#   A reply costs about $0.0011, so $5/day is ~4,500 replies and $50/month ~45,000; normal
#   use never reaches them (October's first week: $0.07). Walt: "option A with $5/day and
#   $50/month". PER_IP_PER_MINUTE is the per-player limit against abuse.
#
#   ALWAYS ON (auto_stop off, min 1). A cold start costs seconds against a measured p50
#   of 957 ms. A player watching Kaia's face wait for a container is worse than the
#   couple of dollars auto-stop saves.
#
#   A DISK (the /data mount). A restart that reset the month's spend to zero would
#   remove the only control that stops at OUR number rather than Google's.
#
#   PICTURES ARE ON (2026-11-01, Walt: "Yes, deploy it"). THE GIST's paintings
#   (backend/pictures.js) have their own ledger on the disk and their own caps - Walt: "nano
#   banana with the daily cap". The kill switch is PICTURES_DISABLED = '1' and a deploy.
#   $0.034 a picture. THREE TIMES MORE (2026-11-02, Walt, after running out "after just a few"):
#   15 per player per day (was 5), and $3/day (~87 pictures across all players, was $1) so the
#   shared day is not the new limit. The monthly brake stays $20 (~580 pictures). A refused wish
#   uses up one of the fifteen too: the count is taken before the screen.
#   Steam copies never ask - a local switch in the game, not this one (plan §6).
#
# See docs/NPC_CHAT_REVIEW.md, docs/GIST_PICTURES_PLAN.md and backend/README.md.

app = 'sibelius-npc-chat'
primary_region = 'sjc'

[build]
[env]
  BUDGET_FILE = '/data/budget.json'
  CHAT_DISABLED = '0'
  DAILY_CAP_USD = '5'
  GEMINI_MODEL = 'gemini-3.1-flash-lite'
  MAX_OUTPUT_TOKENS = '512'
  MONTHLY_CAP_USD = '50'
  PER_IP_PER_MINUTE = '12'
  PICTURES_DISABLED = '0'
  PICTURE_BUDGET_FILE = '/data/pictures.json'
  PICTURE_DAILY_CAP_USD = '3'
  PICTURE_MODEL = 'gemini-3.1-flash-lite-image'
  PICTURE_MONTHLY_CAP_USD = '20'
  PICTURES_PER_PLAYER_PER_DAY = '15'
  PORT = '8787'
  UPSTREAM_TIMEOUT_MS = '20000'

[[mounts]]
  source = 'npcchat_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
